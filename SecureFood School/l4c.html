<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecureFood School · Student Lab</title>
<link rel="stylesheet" href="styles.css">
<script src="js/shell.js"></script>
<style>
/* ── Slim plan header ───────────────────────────────── */
.plan-bar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 18px; padding: 16px 22px;
  background: linear-gradient(135deg, var(--primary) 0%, #1a6373 100%);
  color: #fff; border-radius: var(--radius-lg);
  margin-bottom: 22px;
  box-shadow: 0 6px 20px -8px rgba(15,76,94,0.4);
}
.plan-bar .plan-left { display:flex; align-items:center; gap: 16px; flex:1; min-width:0; }
.plan-bar .pin {
  width: 44px; height: 44px; border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.14);
  display: grid; place-items: center;
  flex-shrink: 0;
}
.plan-bar .pin .material-symbols-rounded { font-size: 24px; color: #E0A458; }
.plan-bar .plan-info .label {
  font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em;
  color: rgba(255,255,255,0.7); font-weight: 600;
}
.plan-bar .plan-info h2 {
  font-size: 1.15rem; color: #fff; margin: 2px 0 0;
  font-family: 'Manrope'; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
}
.plan-bar .plan-info h2 .material-symbols-rounded {
  font-size: 18px; opacity: 0.7; transition: opacity 0.15s;
  color: #fff;
}
.plan-bar .plan-info h2:hover .material-symbols-rounded { opacity: 1; }
.plan-bar .plan-stats {
  display: flex; gap: 28px; align-items: center;
}
.plan-bar .plan-stat .num {
  font-family: 'Manrope'; font-weight: 700;
  font-size: 1.2rem; color: #E0A458;
  line-height: 1;
}
.plan-bar .plan-stat .lbl {
  font-size: 0.72rem; color: rgba(255,255,255,0.7);
  margin-top: 4px; text-transform: uppercase; letter-spacing: 0.06em;
}
.plan-bar .plan-progress {
  width: 220px;
}
.plan-bar .plan-progress .bar {
  height: 6px; border-radius: 999px; background: rgba(255,255,255,0.18);
  overflow: hidden;
}
.plan-bar .plan-progress .bar span {
  display: block; height: 100%;
  background: linear-gradient(90deg, #E0A458, #C68A3B);
  border-radius: 999px;
}
.plan-bar .plan-progress .pct {
  display: flex; justify-content: space-between;
  font-size: 0.72rem; color: rgba(255,255,255,0.8);
  margin-top: 6px;
}
.plan-bar .plan-progress .pct strong { color: #fff; font-family: 'Manrope'; font-weight: 700; }

/* Plan switcher dropdown */
.plan-switcher {
  position: relative;
}
.plan-menu {
  position: absolute; top: calc(100% + 8px); left: 0;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--radius-md);
  box-shadow: 0 12px 32px -8px rgba(0,0,0,0.18);
  min-width: 320px; padding: 8px;
  z-index: 50;
  display: none;
}
.plan-menu.open { display: block; }
.plan-menu-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: var(--radius-sm);
  cursor: pointer;
}
.plan-menu-item:hover { background: var(--surface-2); }
.plan-menu-item.active { background: var(--primary-50); }
.plan-menu-item .pm-icon {
  width: 32px; height: 32px; border-radius: var(--radius-sm);
  background: var(--accent-50); color: var(--accent);
  display: grid; place-items: center; flex-shrink: 0;
}
.plan-menu-item .pm-text strong {
  display: block; font-size: 0.9rem; color: var(--ink);
}
.plan-menu-item .pm-text small {
  font-size: 0.76rem; color: var(--muted);
}

/* ── Course section ─────────────────────────────────── */
.course-section { margin-bottom: 32px; }
.course-section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 14px; gap: 16px;
}
.course-section-head .section-title {
  display: flex; align-items: center; gap: 12px;
}
.course-section-head .num-badge {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--primary); color: #fff;
  display: grid; place-items: center;
  font-family: 'Manrope'; font-weight: 700; font-size: 0.95rem;
}
.course-section-head h3 {
  font-size: 1.2rem; margin: 0;
}
.course-section-head .section-meta {
  font-size: 0.84rem; color: var(--muted);
}
.course-section-head .section-meta .dot { margin: 0 8px; opacity: 0.4; }
.course-section.done .num-badge { background: var(--success); }
.course-section.locked .num-badge { background: var(--muted); }

.course-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.course-tile {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  overflow: hidden;
  display: flex; flex-direction: column;
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  cursor: pointer;
}
.course-tile:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px -10px rgba(0,0,0,0.15);
  border-color: var(--primary);
}
.course-tile .ct-cover {
  height: 100px;
  position: relative;
  display: flex; align-items: center; justify-content: center;
  color: #fff; flex-shrink: 0;
  overflow: hidden;
}
.course-tile .ct-cover::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0) 50%, rgba(0,0,0,0.18));
}
.course-tile .ct-cover .ct-icon {
  width: 48px; height: 48px;
  background: rgba(255,255,255,0.18);
  border-radius: var(--radius-sm);
  display: grid; place-items: center;
  position: relative; z-index: 1;
}
.course-tile .ct-cover .ct-icon .material-symbols-rounded { font-size: 26px; }
.course-tile .ct-cover .ct-tag {
  position: absolute; top: 10px; left: 12px;
  font-size: 0.7rem; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: rgba(255,255,255,0.95);
  z-index: 1;
}
.course-tile .ct-cover .ct-status {
  position: absolute; top: 10px; right: 12px;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(6px);
  font-size: 0.7rem; font-weight: 600;
  padding: 4px 8px; border-radius: 999px;
  display: flex; align-items: center; gap: 4px;
  z-index: 1;
}
.course-tile .ct-cover .ct-status .material-symbols-rounded { font-size: 14px; }
.cov-1 { background: linear-gradient(135deg, #0F4C5E, #2A8C8A); }
.cov-2 { background: linear-gradient(135deg, #2A8C8A, #4FC3C0); }
.cov-3 { background: linear-gradient(135deg, #C68A3B, #E0A458); }
.cov-4 { background: linear-gradient(135deg, #3F8C5A, #65B57F); }
.cov-5 { background: linear-gradient(135deg, #5b6770, #8e9aa3); }

.course-tile .ct-body {
  padding: 14px 16px 16px;
  flex: 1; display: flex; flex-direction: column;
}
.course-tile .ct-body h4 {
  font-size: 1rem; margin-bottom: 6px;
  line-height: 1.35;
}
.course-tile .ct-body .ct-desc {
  font-size: 0.82rem; color: var(--muted);
  line-height: 1.5; margin-bottom: 12px;
  flex: 1;
}
.course-tile .ct-meta {
  display: flex; gap: 14px; font-size: 0.78rem; color: var(--muted);
  margin-bottom: 10px;
}
.course-tile .ct-meta span {
  display: flex; align-items: center; gap: 4px;
}
.course-tile .ct-meta .material-symbols-rounded { font-size: 14px; }
.course-tile .ct-progress {
  height: 4px; background: var(--line); border-radius: 999px;
  overflow: hidden; margin-bottom: 8px;
}
.course-tile .ct-progress span {
  display: block; height: 100%; background: var(--accent);
  border-radius: 999px;
}
.course-tile.done .ct-progress span { background: var(--success); }
.course-tile .ct-foot {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 0.78rem;
}
.course-tile .ct-foot .ct-state-text { color: var(--muted); }
.course-tile.done .ct-foot .ct-state-text { color: var(--success); font-weight: 600; }
.course-tile.active .ct-foot .ct-state-text { color: var(--accent); font-weight: 600; }
.course-tile .ct-foot .ct-action {
  color: var(--primary); font-weight: 600;
  display: flex; align-items: center; gap: 2px;
}

.course-tile.locked { opacity: 0.7; cursor: not-allowed; }
.course-tile.locked:hover { transform: none; box-shadow: none; border-color: var(--line); }
.course-tile.locked .ct-cover { filter: grayscale(0.6); }

@media (max-width: 760px) {
  .plan-bar { flex-direction: column; align-items: stretch; }
  .plan-bar .plan-progress { width: 100%; }
  .plan-bar .plan-stats { justify-content: space-around; }
}
</style>
</head>
<body data-page="l4c">
<script>
SF.mount(
  { crumb: ['Dashboard', 'Student Lab'] },

    <div class="page-head">

            <div class="ct-progress"><span style="width:100%"></span></div>

          </div>

      </div>
    </section>

    <!-- STAGE 2 -->
    <section class="course-section">

        <div class="section-title">

// Plan switcher dropdown
const trigger = document.getElementById('planTrigger');
const menu = document.getElementById('planMenu');
trigger.addEventListener('click', (e) => {
  e.stopPropagation();
  menu.classList.toggle('open');
});
document.addEventListener('click', (e) => {
  if (!menu.contains(e.target)) menu.classList.remove('open');
});

// Click any non-locked course tile → open course detail
document.querySelectorAll('.course-tile').forEach(tile => {
  if (tile.classList.contains('locked')) return;
  tile.addEventListener('click', () => {
    window.location.href = 'course.html';
  });
});
</script>
</body>
</html>
