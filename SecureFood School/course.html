<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecureFood School · Course</title>
<link rel="stylesheet" href="styles.css">
<style>
/* ── Course banner ─────────────────────────────────────── */
.course-banner {
  position: relative;
  border-radius: var(--radius-md);
  padding: 36px 38px;
  background: radial-gradient(120% 80% at 100% 0%, rgba(224,164,88,0.22), transparent 55%),
              linear-gradient(135deg, #0F4C5E 0%, #2A8C8A 100%);
  color: #fff; overflow: hidden;
  margin-bottom: 24px;
}
.course-banner .crumbs {
  font-size: 0.82rem; color: rgba(255,255,255,0.7);
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.course-banner .crumbs a { color: rgba(255,255,255,0.85); text-decoration: underline; text-decoration-color: rgba(255,255,255,0.25); }
.course-banner .crumbs .material-symbols-rounded { font-size: 14px; opacity: 0.6; }
.course-banner h1 { color: #fff; font-size: 2rem; max-width: 26ch; margin-bottom: 10px; }
.course-banner p { color: rgba(255,255,255,0.85); max-width: 64ch; line-height: 1.55; }
.course-banner .banner-meta {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-top: 18px;
}
.banner-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: 999px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.16);
  font-size: 0.78rem; font-weight: 500;
  color: rgba(255,255,255,0.9);
}
.banner-chip .material-symbols-rounded { font-size: 14px; }
.banner-chip.solid { background: #E0A458; border-color: transparent; color: #0F4C5E; font-weight: 700; }
.course-banner-icon {
  position: absolute; right: 36px; top: 50%;
  transform: translateY(-50%);
  width: 120px; height: 120px;
  border-radius: 22px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.16);
  display: grid; place-items: center;
  color: #fff;
  backdrop-filter: blur(4px);
}
.course-banner-icon .material-symbols-rounded { font-size: 56px; }

/* ── Layout ────────────────────────────────────────────── */
.course-layout {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 24px;
  align-items: flex-start;
}

/* ── Progress card ─────────────────────────────────────── */
.course-progress {
  padding: 22px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface);
  margin-bottom: 22px;
}
.course-progress-head {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-bottom: 14px; gap: 10px; flex-wrap: wrap;
}
.course-progress h3 { font-size: 1rem; margin: 0; }
.course-progress .progress-pct {
  font-family: 'Manrope'; font-weight: 800;
  color: var(--accent); font-size: 1.4rem;
  letter-spacing: -0.02em;
}
.progress-track {
  width: 100%; height: 8px; background: var(--bg-2);
  border-radius: 999px; overflow: hidden;
}
.progress-track span {
  display: block; height: 100%;
  background: linear-gradient(90deg, var(--teal), var(--accent));
  border-radius: 999px;
}
.progress-stats {
  display: grid; grid-template-columns: repeat(4, 1fr);
  margin-top: 14px;
  border-top: 1px solid var(--line);
  padding-top: 14px;
  text-align: left; gap: 0;
}
.progress-stats .ps {
  padding: 0 14px;
  border-right: 1px solid var(--line);
}
.progress-stats .ps:first-child { padding-left: 0; }
.progress-stats .ps:last-child { border-right: none; }
.progress-stats .ps .num {
  font-family: 'Manrope'; font-weight: 700;
  font-size: 1.1rem; color: var(--ink);
}
.progress-stats .ps .lbl {
  font-size: 0.74rem; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.05em;
  font-weight: 600; margin-top: 3px;
}

/* ── Sections ──────────────────────────────────────────── */
.section-card {
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface);
  margin-bottom: 14px;
  overflow: hidden;
}
.section-head {
  display: grid;
  grid-template-columns: 36px 1fr auto auto;
  align-items: center; gap: 14px;
  padding: 16px 20px;
  cursor: pointer;
  user-select: none;
  background: var(--surface);
  transition: background .15s;
}
.section-head:hover { background: var(--surface-2); }
.section-head .sec-num {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--primary-50); color: var(--primary);
  display: grid; place-items: center;
  font-family: 'Manrope'; font-weight: 700; font-size: 0.92rem;
}
.section-head .sec-info h3 { font-size: 1.04rem; margin-bottom: 2px; }
.section-head .sec-info small { font-size: 0.8rem; color: var(--muted); }
.section-head .sec-progress {
  text-align: right;
  font-size: 0.78rem; color: var(--muted);
}
.section-head .sec-progress .frac { font-family: 'Manrope'; font-weight: 700; color: var(--ink); font-size: 0.94rem; }
.section-head .toggle {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--surface-2);
  display: grid; place-items: center;
  color: var(--muted);
  transition: transform .25s;
}
.section-card.open .toggle { transform: rotate(180deg); color: var(--ink); }
.section-card.done .sec-num { background: rgba(63,140,90,0.14); color: var(--success); }

.section-body {
  border-top: 1px solid var(--line);
  background: var(--bg);
  display: none;
}
.section-card.open .section-body { display: block; }

.activity {
  display: grid;
  grid-template-columns: 40px 1fr auto auto;
  align-items: center;
  gap: 14px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--line);
  transition: background .12s;
  cursor: pointer;
}
.activity:last-child { border-bottom: none; }
.activity:hover { background: var(--surface-2); }
.activity .a-icon {
  width: 40px; height: 40px; border-radius: 10px;
  display: grid; place-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
}
.activity .a-icon .material-symbols-rounded { font-size: 22px; }
.activity.t-lesson .a-icon { background: var(--primary-50); color: var(--primary); border-color: transparent; }
.activity.t-quiz   .a-icon { background: var(--accent-50); color: var(--accent); border-color: transparent; }
.activity.t-task   .a-icon { background: rgba(63,140,90,0.12); color: var(--success); border-color: transparent; }
.activity.t-video  .a-icon { background: var(--teal-50); color: var(--teal); border-color: transparent; }
.activity.t-forum  .a-icon { background: rgba(184,70,63,0.10); color: var(--danger); border-color: transparent; }
.activity.t-file   .a-icon { background: var(--surface-2); color: var(--ink-2); }

.activity .a-info { min-width: 0; }
.activity .a-info .a-title {
  font-weight: 600; font-size: 0.95rem;
  color: var(--ink);
}
.activity .a-info .a-meta {
  font-size: 0.78rem; color: var(--muted); margin-top: 2px;
  display: flex; align-items: center; gap: 10px;
}
.activity .a-info .a-meta .material-symbols-rounded { font-size: 13px; }
.activity .a-meta .dot { width: 3px; height: 3px; background: var(--muted-2); border-radius: 50%; }

.activity .a-state {
  font-size: 0.78rem; font-weight: 600;
}
.activity.done .a-state { color: var(--success); }
.activity.current .a-state { color: var(--accent); }
.activity .a-state .material-symbols-rounded { font-size: 14px; vertical-align: -2px; }
.activity .a-go {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--line);
  display: grid; place-items: center;
  color: var(--ink-2); transition: all .15s;
}
.activity:hover .a-go { background: var(--primary); color: #fff; border-color: var(--primary); }
.activity.locked { opacity: 0.55; cursor: not-allowed; }
.activity.locked:hover { background: transparent; }
.activity.locked:hover .a-go { background: var(--surface); color: var(--ink-2); border-color: var(--line); }

/* ── Right rail ────────────────────────────────────────── */
.rail-card {
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface);
  margin-bottom: 16px;
}
.rail-card h4 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 14px; font-weight: 700; }
.rail-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.rail-row + .rail-row { border-top: 1px solid var(--line); }
.rail-row .rr-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--teal));
  color: #fff; font-family: 'Manrope'; font-weight: 700;
  font-size: 0.82rem;
  display: grid; place-items: center;
  flex-shrink: 0;
}
.rail-row .rr-avatar.amber { background: linear-gradient(135deg, #C68A3B, #E0A458); }
.rail-row .rr-info strong { display: block; font-size: 0.88rem; color: var(--ink); }
.rail-row .rr-info small { font-size: 0.76rem; color: var(--muted); }

.due-pill {
  padding: 14px;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, rgba(224,164,88,0.14), rgba(198,138,59,0.10));
  border: 1px solid rgba(198,138,59,0.2);
}
.due-pill .label {
  font-size: 0.72rem; color: var(--accent); font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
}
.due-pill .title { font-weight: 700; margin: 4px 0; font-family: 'Manrope'; color: var(--ink); }
.due-pill .when { font-size: 0.82rem; color: var(--muted); }

.info-list { display: grid; gap: 10px; }
.info-list .row {
  display: flex; justify-content: space-between;
  font-size: 0.84rem;
}
.info-list .row .lbl { color: var(--muted); }
.info-list .row .val { color: var(--ink); font-weight: 600; }

@media (max-width: 1100px) {
  .course-layout { grid-template-columns: 1fr; }
  .course-banner-icon { display: none; }
}
@media (max-width: 700px) {
  .course-banner { padding: 28px 22px; }
  .course-banner h1 { font-size: 1.6rem; }
  .activity { grid-template-columns: 40px 1fr auto; }
  .activity .a-go { display: none; }
  .progress-stats { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .progress-stats .ps { padding: 6px; border: none; }
}
</style>
<script src="js/shell.js"></script>
</head>
