<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecureFood School · Resources &amp; Standards</title>
<link rel="stylesheet" href="./styles.css">
<script src="./js/shell.js"></script>
<style>
.gov-period {
  display: inline-flex;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
}
.gov-period .seg {
  border: none;
  background: transparent;
  color: var(--muted);
  font: 600 0.75rem 'Inter';
  border-radius: 999px;
  padding: 6px 10px;
  cursor: pointer;
}
.gov-period .seg.active {
  background: var(--primary);
  color: #fff;
}
.gov-tools .tool {
  position: relative;
}
.gov-tools .tool.active {
  border-color: var(--primary);
  background: var(--primary-50);
  box-shadow: var(--shadow-2);
}
.gov-tools .tool.active::after {
  content: '';
  position: absolute;
  top: 10px;
  right: 10px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--primary);
}
.gov-resource-toolbar {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 10px;
  margin-bottom: 14px;
  align-items: center;
}
.gov-resource-search {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 12px;
  background: var(--surface);
  color: var(--muted);
}
.gov-resource-search input {
  border: none;
  outline: none;
  background: transparent;
  width: 100%;
  color: var(--ink);
  font: inherit;
  font-size: 0.84rem;
}
.gov-resource-sort {
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink-2);
  font: 600 0.8rem 'Inter';
  padding: 8px 12px;
}
.resource-head-main {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.doc-row {
  grid-template-columns: 44px 1fr auto auto auto;
}
.doc-row.bookmarked {
  border-color: var(--accent);
  background: linear-gradient(180deg, var(--surface) 0%, var(--accent-50) 100%);
}
.doc-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}
.doc-actions .bookmark,
.doc-actions .download {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface);
  display: grid;
  place-items: center;
  color: var(--ink-2);
  cursor: pointer;
}
.doc-actions .bookmark.active {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-50);
}
.doc-actions .bookmark:hover,
.doc-actions .download:hover {
  border-color: var(--primary);
  color: var(--primary);
}
.gov-empty {
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius-sm);
  text-align: center;
  color: var(--muted);
  padding: 20px 14px;
  font-size: 0.86rem;
}
.poll-results {
  display: grid;
  gap: 8px;
}
.poll-line {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  font-size: 0.8rem;
  color: var(--ink-2);
}
.poll-line strong { font-family: 'Manrope'; color: var(--ink); }
.poll-foot {
  margin-top: 4px;
  font-size: 0.76rem;
  color: var(--muted);
}
.validate-card .vote-row .poll-reset {
  flex: 0 0 auto;
  padding: 8px 10px;
}
.activity-card {
  padding: 18px 16px;
}
.activity-card h3 {
  margin-bottom: 10px;
}
.activity-list {
  display: grid;
  gap: 8px;
}
.activity-row {
  display: grid;
  grid-template-columns: 22px 1fr auto;
  gap: 8px;
  align-items: center;
  padding: 8px 9px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
}
.activity-row .material-symbols-rounded {
  font-size: 16px;
  color: var(--primary);
}
.activity-row .text {
  font-size: 0.78rem;
  color: var(--ink-2);
}
.activity-row .time {
  font-size: 0.72rem;
  color: var(--muted);
  white-space: nowrap;
}
@media (max-width: 980px) {
  .gov-resource-toolbar {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body data-page="governance">
<script>
SF.mount(
  { crumb: ['Dashboard', 'Resources & Standards'] },
  `
    <div class="page-head">
      <div class="titles">
        <div class="kicker">Governance hub</div>
        <h1>Resources &amp; Standards</h1>
        <p class="lede">All protocols, contracts and reference documents in one place — searchable, role-tagged, and ready to share with school staff and suppliers.</p>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <span class="chip solid-success" id="systemChip"><span class="material-symbols-rounded">circle</span>System operational</span>
        <div class="gov-period" id="periodFilters">
          <button class="seg" data-period="7d">7d</button>
          <button class="seg active" data-period="30d">30d</button>
          <button class="seg" data-period="90d">90d</button>
        </div>
        <button class="btn btn-ghost" id="refreshMetricsBtn"><span class="material-symbols-rounded">sync</span>Refresh</button>
        <button class="btn btn-primary" id="downloadReportBtn"><span class="material-symbols-rounded">file_download</span>Download report</button>
      </div>
    </div>

    <div class="gov-grid-3">
      <div class="kpi">
        <div class="kpi-head"><span>Infrastructure readiness</span><span class="material-symbols-rounded">construction</span></div>
        <div class="kpi-value" id="kpiInfraValue">82%</div>
        <div class="progress" style="margin-top:10px;"><span id="kpiInfraBar" style="width:82%;background:var(--teal);"></span></div>
        <div class="kpi-sub up" style="margin-top:8px;" id="kpiInfraSub"><span class="material-symbols-rounded" style="font-size:14px;">trending_up</span>+4 pts vs last quarter</div>
      </div>
      <div class="kpi">
        <div class="kpi-head"><span>Social acceptance</span><span class="material-symbols-rounded">groups</span></div>
        <div class="kpi-value" id="kpiSocialValue">4.2 <span style="font-size:0.92rem;color:var(--muted);font-weight:500;">/ 5.0</span></div>
        <div class="progress amber" style="margin-top:10px;"><span id="kpiSocialBar" style="width:84%"></span></div>
        <div class="kpi-sub up" style="margin-top:8px;" id="kpiSocialSub"><span class="material-symbols-rounded" style="font-size:14px;">trending_up</span>1,420 surveys</div>
      </div>
      <div class="kpi">
        <div class="kpi-head"><span>Staff trained</span><span class="material-symbols-rounded">school</span></div>
        <div class="kpi-value" id="kpiStaffValue">145</div>
        <div class="progress" style="margin-top:10px;"><span id="kpiStaffBar" style="width:60%"></span></div>
        <div class="kpi-sub" style="margin-top:8px;color:var(--muted);" id="kpiStaffSub">L4C courses completed</div>
      </div>
    </div>

    <h2 style="margin-bottom:14px;">Management tools</h2>
    <div class="gov-tools" id="govTools">
      <div class="tool" data-tool="protocols">
        <div class="tool-icon"><span class="material-symbols-rounded">assignment</span></div>
        <h4>Protocols</h4>
        <div class="desc">Active safety standards and HACCP guidelines.</div>
        <div class="count"><span>Active</span><strong>24</strong></div>
      </div>
      <div class="tool" data-tool="tech">
        <div class="tool-icon" style="background:var(--teal-50);color:var(--teal);"><span class="material-symbols-rounded">settings_input_antenna</span></div>
        <h4>Tech Check</h4>
        <div class="desc">Digital twin setup and sensor diagnostics.</div>
        <div class="count"><span>Sensors</span><strong>312</strong></div>
      </div>
      <div class="tool" data-tool="surveys">
        <div class="tool-icon" style="background:var(--accent-50);color:var(--accent);"><span class="material-symbols-rounded">how_to_vote</span></div>
        <h4>Surveys</h4>
        <div class="desc">Community polls and parent feedback rounds.</div>
        <div class="count"><span>Open</span><strong>3</strong></div>
      </div>
      <div class="tool" data-tool="legal">
        <div class="tool-icon"><span class="material-symbols-rounded">gavel</span></div>
        <h4>Legal</h4>
        <div class="desc">Contracts, supplier MoUs, compliance.</div>
        <div class="count"><span>Files</span><strong>47</strong></div>
      </div>
    </div>

    <div class="map-grid" style="grid-template-columns: 2fr 1fr;">
      <div class="card resource-card">
        <div class="resource-head">
          <div class="resource-head-main">
            <h3>Resource library</h3>
            <span class="chip solid-teal" id="resourceCount">0 shown</span>
          </div>
          <div class="filters" id="resourceFilters">
            <button class="filter-pill active" data-filter="all">All</button>
            <button class="filter-pill" data-filter="director">Director</button>
            <button class="filter-pill" data-filter="supplier">Supplier</button>
            <button class="filter-pill" data-filter="tech">Tech</button>
            <button class="filter-pill" data-filter="legal">Legal</button>
            <button class="filter-pill" data-filter="bookmarked">Bookmarked</button>
          </div>
        </div>
        <div class="gov-resource-toolbar">
          <label class="gov-resource-search">
            <span class="material-symbols-rounded" style="font-size:18px;">search</span>
            <input id="docSearch" type="text" placeholder="Search title or description...">
          </label>
          <select id="docSort" class="gov-resource-sort">
            <option value="recent">Most recent</option>
            <option value="title">Title A–Z</option>
            <option value="kind">File type</option>
          </select>
          <button class="btn btn-ghost" id="clearDocFilters" style="padding:8px 12px;font-size:0.78rem;">Clear filters</button>
        </div>
        <div class="doc-list" id="docList"></div>
        <div style="text-align:center;margin-top:14px;">
          <button class="btn-link">View all 24 documents →</button>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:18px;">
        <div class="card validate-card">
          <h3>Quick validation</h3>
          <p class="scenario">Is the "Cold Chain v2" protocol clear enough for your kitchen staff?</p>
          <div class="poll-results">
            <div class="poll-line"><span>Yes, clear</span><strong id="voteYesPct">0%</strong></div>
            <div class="progress"><span id="voteYesBar" style="width:0%;background:var(--success);"></span></div>
            <div class="poll-line"><span>Needs work</span><strong id="voteNoPct">0%</strong></div>
            <div class="progress amber"><span id="voteNoBar" style="width:0%;"></span></div>
            <div class="poll-foot" id="voteTotal">0 votes</div>
          </div>
          <div class="vote-row">
            <button class="btn btn-primary" data-vote="yes"><span class="material-symbols-rounded">thumb_up</span>Yes, clear</button>
            <button class="btn btn-ghost" data-vote="no"><span class="material-symbols-rounded">thumb_down</span>Needs work</button>
            <button class="btn btn-ghost poll-reset" id="resetVoteBtn"><span class="material-symbols-rounded">restart_alt</span>Reset</button>
          </div>
          <div class="expert-block">
            Need help? <a href="#">Contact an expert →</a>
          </div>
        </div>

        <div class="gov-side-stats">
          <div class="side-stat"><div class="icon"><span class="material-symbols-rounded">menu_book</span></div><div><div class="num" id="visibleDocsStat">0</div><div class="lbl">Visible docs</div></div></div>
          <div class="side-stat"><div class="icon" style="background:var(--teal-50);color:var(--teal);"><span class="material-symbols-rounded">bookmark</span></div><div><div class="num" id="bookmarkedDocsStat">0</div><div class="lbl">Bookmarked</div></div></div>
          <div class="side-stat"><div class="icon" style="background:var(--primary-50);color:var(--primary);"><span class="material-symbols-rounded">history</span></div><div><div class="num" id="avgApprovalStat">2.3 days</div><div class="lbl">Avg approval time</div></div></div>
        </div>

        <div class="card activity-card">
          <h3>Recent activity</h3>
          <div class="activity-list" id="activityList"></div>
        </div>
      </div>
    </div>
  `
);

const STORAGE = {
  bookmarks: 'sf-gov-bookmarks',
  poll: 'sf-gov-poll'
};

const DOCS = [
  { id: 'haccp', title: 'HACCP Protocol v2.1', sub: 'Cold chain & temperature thresholds', role: 'director', kind: 'pdf', updated: '2 days ago', updatedDays: 2 },
  { id: 'mou', title: 'Supplier MoU Template', sub: 'Standard agreement, EU-aligned', role: 'supplier', kind: 'doc', updated: '5 days ago', updatedDays: 5 },
  { id: 'calibration', title: 'Sensor Calibration Guide', sub: 'Setup & maintenance for IoT nodes', role: 'tech', kind: 'pdf', updated: '1 week ago', updatedDays: 7 },
  { id: 'menu-audit', title: 'Menu Audit Worksheet', sub: 'Weekly nutritional check', role: 'director', kind: 'xls', updated: '1 week ago', updatedDays: 8 },
  { id: 'privacy-annex', title: 'Data Privacy Annex', sub: 'GDPR clauses for school data', role: 'legal', kind: 'pdf', updated: '2 weeks ago', updatedDays: 14 },
  { id: 'procurement', title: 'Procurement Checklist', sub: 'Vegetables & dairy verification', role: 'supplier', kind: 'pdf', updated: '3 weeks ago', updatedDays: 21 },
  { id: 'twin-bundle', title: 'Twin Deployment Bundle', sub: 'Onboarding kit for new hubs', role: 'tech', kind: 'zip', updated: '1 month ago', updatedDays: 30 },
  { id: 'contract-pack', title: 'Contract Renewal Pack', sub: 'School suppliers 2026 contract templates', role: 'legal', kind: 'doc', updated: '1 month ago', updatedDays: 33 },
  { id: 'incident-report', title: 'Incident Report Form', sub: 'Standard response and escalation template', role: 'director', kind: 'pdf', updated: '6 weeks ago', updatedDays: 42 }
];

const PERIODS = {
  '7d': { infra: 79, delta: '+1 pt vs previous week', social: 4.1, surveys: 320, staff: 34, staffPct: 48, approval: '2.0 days' },
  '30d': { infra: 82, delta: '+4 pts vs last quarter', social: 4.2, surveys: 1420, staff: 145, staffPct: 60, approval: '2.3 days' },
  '90d': { infra: 84, delta: '+6 pts vs previous cycle', social: 4.3, surveys: 4080, staff: 278, staffPct: 72, approval: '2.6 days' }
};

const TOOL_FILTER = {
  protocols: 'director',
  tech: 'tech',
  surveys: 'supplier',
  legal: 'legal'
};

const ROLE_LABELS = {
  director: 'Director',
  supplier: 'Supplier',
  tech: 'Tech',
  legal: 'Legal'
};

function loadSet(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return new Set();
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) return new Set();
    return new Set(parsed);
  } catch (_) {
    return new Set();
  }
}

function saveSet(key, setValue) {
  localStorage.setItem(key, JSON.stringify([...setValue]));
}

function loadPoll() {
  try {
    const raw = localStorage.getItem(STORAGE.poll);
    if (!raw) return { yes: 18, no: 5 };
    const parsed = JSON.parse(raw);
    return {
      yes: Number(parsed.yes) || 0,
      no: Number(parsed.no) || 0
    };
  } catch (_) {
    return { yes: 18, no: 5 };
  }
}

function savePoll(v) {
  localStorage.setItem(STORAGE.poll, JSON.stringify(v));
}

const state = {
  activeFilter: 'all',
  activeTool: null,
  search: '',
  sort: 'recent',
  period: '30d',
  bookmarks: loadSet(STORAGE.bookmarks),
  poll: loadPoll(),
  activities: [
    { icon: 'sync', text: 'Resource index synced', time: 'just now' },
    { icon: 'menu_book', text: 'HACCP Protocol v2.1 reviewed', time: '15 min ago' },
    { icon: 'thumb_up', text: 'Validation feedback submitted', time: '1 h ago' }
  ]
};

const refs = {
  list: document.getElementById('docList'),
  filters: document.getElementById('resourceFilters'),
  tools: document.getElementById('govTools'),
  search: document.getElementById('docSearch'),
  sort: document.getElementById('docSort'),
  count: document.getElementById('resourceCount'),
  visibleDocsStat: document.getElementById('visibleDocsStat'),
  bookmarkedDocsStat: document.getElementById('bookmarkedDocsStat'),
  avgApprovalStat: document.getElementById('avgApprovalStat'),
  activityList: document.getElementById('activityList'),
  period: document.getElementById('periodFilters'),
  systemChip: document.getElementById('systemChip')
};

function escapeHTML(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function addActivity(icon, text, time = 'just now') {
  state.activities.unshift({ icon, text, time });
  state.activities = state.activities.slice(0, 8);
  renderActivity();
}

function renderActivity() {
  if (!state.activities.length) {
    refs.activityList.innerHTML = '<div class="gov-empty">No activity yet</div>';
    return;
  }
  refs.activityList.innerHTML = state.activities.map(item => `
    <div class="activity-row fade-in">
      <span class="material-symbols-rounded">${escapeHTML(item.icon)}</span>
      <span class="text">${escapeHTML(item.text)}</span>
      <span class="time">${escapeHTML(item.time)}</span>
    </div>
  `).join('');
}

function applyPeriod(period) {
  const p = PERIODS[period];
  state.period = period;
  document.getElementById('kpiInfraValue').textContent = `${p.infra}%`;
  document.getElementById('kpiInfraBar').style.width = `${p.infra}%`;
  document.getElementById('kpiInfraSub').innerHTML = `<span class="material-symbols-rounded" style="font-size:14px;">trending_up</span>${p.delta}`;

  document.getElementById('kpiSocialValue').innerHTML = `${p.social.toFixed(1)} <span style="font-size:0.92rem;color:var(--muted);font-weight:500;">/ 5.0</span>`;
  document.getElementById('kpiSocialBar').style.width = `${Math.round((p.social / 5) * 100)}%`;
  document.getElementById('kpiSocialSub').innerHTML = `<span class="material-symbols-rounded" style="font-size:14px;">trending_up</span>${p.surveys.toLocaleString('en-US')} surveys`;

  document.getElementById('kpiStaffValue').textContent = p.staff.toLocaleString('en-US');
  document.getElementById('kpiStaffBar').style.width = `${p.staffPct}%`;
  document.getElementById('kpiStaffSub').textContent = 'L4C courses completed';

  refs.avgApprovalStat.textContent = p.approval;
  refs.systemChip.innerHTML = `<span class="material-symbols-rounded">circle</span>System operational · ${period} view`;

  refs.period.querySelectorAll('[data-period]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.period === period);
  });
}

function getFilteredDocs() {
  const q = state.search.trim().toLowerCase();
  return DOCS.filter(doc => {
    const roleMatch =
      state.activeFilter === 'all' ||
      (state.activeFilter === 'bookmarked' ? state.bookmarks.has(doc.id) : doc.role === state.activeFilter);
    const searchMatch = !q || `${doc.title} ${doc.sub}`.toLowerCase().includes(q);
    return roleMatch && searchMatch;
  });
}

function sortDocs(docs) {
  const arr = [...docs];
  if (state.sort === 'title') {
    arr.sort((a, b) => a.title.localeCompare(b.title));
  } else if (state.sort === 'kind') {
    arr.sort((a, b) => a.kind.localeCompare(b.kind) || a.title.localeCompare(b.title));
  } else {
    arr.sort((a, b) => a.updatedDays - b.updatedDays);
  }
  return arr;
}

function syncFilterUi() {
  refs.filters.querySelectorAll('[data-filter]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === state.activeFilter);
  });
}

function syncToolUi() {
  refs.tools.querySelectorAll('[data-tool]').forEach(el => {
    el.classList.toggle('active', el.dataset.tool === state.activeTool);
  });
}

function renderDocs() {
  const visible = sortDocs(getFilteredDocs());
  refs.count.textContent = `${visible.length} shown`;
  refs.visibleDocsStat.textContent = String(visible.length);
  refs.bookmarkedDocsStat.textContent = String(state.bookmarks.size);

  if (!visible.length) {
    refs.list.innerHTML = '<div class="gov-empty">No documents match your current filters.</div>';
    return;
  }

  refs.list.innerHTML = visible.map(doc => `
    <div class="doc-row fade-in ${state.bookmarks.has(doc.id) ? 'bookmarked' : ''}">
      <div class="doc-icon ${doc.kind}">${escapeHTML(doc.kind.toUpperCase())}</div>
      <div class="doc-meta">
        <div class="title">${escapeHTML(doc.title)}</div>
        <div class="sub">${escapeHTML(doc.sub)}</div>
      </div>
      <div class="role-tag"><span class="chip">${escapeHTML(ROLE_LABELS[doc.role])}</span></div>
      <div class="updated">${escapeHTML(doc.updated)}</div>
      <div class="doc-actions">
        <button class="bookmark ${state.bookmarks.has(doc.id) ? 'active' : ''}" data-bookmark="${escapeHTML(doc.id)}" aria-label="Bookmark">
          <span class="material-symbols-rounded" style="font-size:18px;">${state.bookmarks.has(doc.id) ? 'star' : 'star_outline'}</span>
        </button>
        <button class="download" data-download="${escapeHTML(doc.id)}" aria-label="Download">
          <span class="material-symbols-rounded" style="font-size:18px;">file_download</span>
        </button>
      </div>
    </div>
  `).join('');
}

function renderPoll() {
  const total = state.poll.yes + state.poll.no;
  const yesPct = total ? Math.round((state.poll.yes / total) * 100) : 0;
  const noPct = total ? 100 - yesPct : 0;
  document.getElementById('voteYesPct').textContent = `${yesPct}%`;
  document.getElementById('voteNoPct').textContent = `${noPct}%`;
  document.getElementById('voteYesBar').style.width = `${yesPct}%`;
  document.getElementById('voteNoBar').style.width = `${noPct}%`;
  document.getElementById('voteTotal').textContent = `${total} vote${total === 1 ? '' : 's'}`;
}

function resetFilters() {
  state.activeFilter = 'all';
  state.activeTool = null;
  state.search = '';
  state.sort = 'recent';
  refs.search.value = '';
  refs.sort.value = 'recent';
  syncFilterUi();
  syncToolUi();
  renderDocs();
}

refs.filters.addEventListener('click', (event) => {
  const btn = event.target.closest('[data-filter]');
  if (!btn) return;
  state.activeFilter = btn.dataset.filter;
  state.activeTool = null;
  syncFilterUi();
  syncToolUi();
  renderDocs();
});

refs.tools.addEventListener('click', (event) => {
  const card = event.target.closest('[data-tool]');
  if (!card) return;
  const tool = card.dataset.tool;
  if (state.activeTool === tool) {
    state.activeTool = null;
    state.activeFilter = 'all';
  } else {
    state.activeTool = tool;
    state.activeFilter = TOOL_FILTER[tool] || 'all';
  }
  syncToolUi();
  syncFilterUi();
  renderDocs();
});

refs.search.addEventListener('input', () => {
  state.search = refs.search.value;
  renderDocs();
});

refs.sort.addEventListener('change', () => {
  state.sort = refs.sort.value;
  renderDocs();
});

document.getElementById('clearDocFilters').addEventListener('click', () => {
  resetFilters();
});

refs.list.addEventListener('click', (event) => {
  const bookmark = event.target.closest('[data-bookmark]');
  if (bookmark) {
    const id = bookmark.dataset.bookmark;
    if (state.bookmarks.has(id)) {
      state.bookmarks.delete(id);
      addActivity('bookmark_remove', 'Bookmark removed');
    } else {
      state.bookmarks.add(id);
      addActivity('bookmark', 'Document bookmarked');
    }
    saveSet(STORAGE.bookmarks, state.bookmarks);
    renderDocs();
    return;
  }

  const download = event.target.closest('[data-download]');
  if (download) {
    const id = download.dataset.download;
    const doc = DOCS.find(item => item.id === id);
    if (!doc) return;
    download.innerHTML = '<span class="material-symbols-rounded" style="font-size:18px;">check</span>';
    setTimeout(() => {
      download.innerHTML = '<span class="material-symbols-rounded" style="font-size:18px;">file_download</span>';
    }, 900);
    addActivity('download', `${doc.title} downloaded`);
  }
});

refs.period.addEventListener('click', (event) => {
  const btn = event.target.closest('[data-period]');
  if (!btn) return;
  applyPeriod(btn.dataset.period);
  addActivity('timeline', `Metrics switched to ${btn.dataset.period} view`);
});

document.getElementById('refreshMetricsBtn').addEventListener('click', (event) => {
  const btn = event.currentTarget;
  if (btn.disabled) return;
  btn.disabled = true;
  btn.innerHTML = '<span class="material-symbols-rounded">sync</span>Syncing...';
  setTimeout(() => {
    applyPeriod(state.period);
    addActivity('sync', `Metrics refreshed for ${state.period} view`);
    btn.disabled = false;
    btn.innerHTML = '<span class="material-symbols-rounded">sync</span>Refresh';
  }, 700);
});

document.getElementById('downloadReportBtn').addEventListener('click', () => {
  addActivity('file_download', `Governance report exported (${state.period})`);
});

document.querySelectorAll('[data-vote]').forEach(btn => btn.addEventListener('click', () => {
  const yes = btn.dataset.vote === 'yes';
  if (yes) state.poll.yes += 1;
  else state.poll.no += 1;
  savePoll(state.poll);
  renderPoll();
  addActivity(yes ? 'thumb_up' : 'thumb_down', yes ? 'Validation voted: clear' : 'Validation voted: needs work');
}));

document.getElementById('resetVoteBtn').addEventListener('click', () => {
  state.poll = { yes: 0, no: 0 };
  savePoll(state.poll);
  renderPoll();
  addActivity('restart_alt', 'Validation poll reset');
});

applyPeriod(state.period);
syncFilterUi();
syncToolUi();
renderDocs();
renderPoll();
renderActivity();
</script>
</body>
</html>
