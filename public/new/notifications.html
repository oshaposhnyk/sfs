<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecureFood School · Notifications</title>
<link rel="stylesheet" href="./styles.css">
<script src="./js/shell.js"></script>
<style>
.notify-layout {
  display: grid;
  grid-template-columns: 1.45fr 1fr;
  gap: 22px;
  align-items: start;
}
.notify-panel { padding: 22px; }
.notify-toolbar {
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; margin-bottom: 18px; flex-wrap: wrap;
}
.notify-filters { display: flex; gap: 6px; flex-wrap: wrap; }
.notify-filter {
  padding: 7px 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  font: 600 0.78rem 'Inter';
  color: var(--muted);
  cursor: pointer;
  transition: all 0.12s;
}
.notify-filter:hover { background: var(--surface-2); color: var(--ink-2); }
.notify-filter.active {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.notify-list { display: grid; gap: 20px; }
.notify-group { display: grid; gap: 10px; }
.notify-group-label {
  font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
  font-weight: 700; color: var(--muted);
}
.notify-item {
  display: grid;
  grid-template-columns: 42px 1fr auto;
  gap: 12px;
  align-items: start;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  transition: border-color 0.12s, box-shadow 0.12s, transform 0.12s;
}
.notify-item:hover {
  border-color: var(--line-strong);
  box-shadow: var(--shadow-1);
  transform: translateY(-1px);
}
.notify-item.unread {
  border-color: var(--primary);
  background: linear-gradient(180deg, var(--surface) 0%, var(--primary-50) 100%);
}
.notify-icon {
  width: 40px; height: 40px; border-radius: 10px;
  display: grid; place-items: center;
  background: var(--surface-2);
  color: var(--muted);
}
.notify-icon.learning { background: var(--primary-50); color: var(--primary); }
.notify-icon.grades { background: var(--teal-50); color: var(--teal); }
.notify-icon.rewards { background: var(--accent-50); color: var(--accent); }
.notify-icon.system { background: rgba(63,140,90,0.12); color: var(--success); }
.notify-icon .material-symbols-rounded { font-size: 21px; }
.notify-body .title {
  font-size: 0.92rem; color: var(--ink); font-weight: 600; margin-bottom: 4px;
}
.notify-body .desc {
  font-size: 0.82rem; color: var(--muted); line-height: 1.45; margin-bottom: 8px;
}
.notify-meta {
  display: flex; gap: 6px; align-items: center;
  flex-wrap: wrap;
}
.notify-actions {
  display: flex; flex-direction: column; align-items: flex-end;
  gap: 8px;
}
.notify-when {
  font-size: 0.74rem; color: var(--muted); white-space: nowrap;
}
.mini-btn {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  border-radius: 999px;
  font: 600 0.74rem 'Inter';
  padding: 5px 10px;
  cursor: pointer;
}
.mini-btn:hover { border-color: var(--primary); color: var(--primary); }
.list-empty {
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius-sm);
  padding: 26px;
  color: var(--muted);
  text-align: center;
  font-size: 0.9rem;
}
.side-stack {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.side-card { padding: 20px; }
.side-card h3 { margin-bottom: 12px; }
.side-list { display: grid; gap: 10px; }
.side-row {
  display: flex; align-items: flex-start; gap: 10px;
  font-size: 0.84rem; color: var(--ink-2);
}
.side-row .material-symbols-rounded {
  font-size: 18px; color: var(--accent); margin-top: 2px;
}
.grade-watch { display: grid; gap: 8px; }
.grade-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
}
.grade-row .subject { font-size: 0.84rem; font-weight: 600; color: var(--ink); }
.grade-row .meta { font-size: 0.74rem; color: var(--muted); margin-top: 2px; }
.grade-row .value {
  font-family: 'Manrope';
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--primary);
}
@media (max-width: 1100px) {
  .notify-layout { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .notify-item { grid-template-columns: 40px 1fr; }
  .notify-actions {
    grid-column: 2;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
  }
}
</style>
</head>
<body data-page="notifications">
<script>
SF.mount(
  { crumb: ['Dashboard', 'Notifications'] },
  `
    <div class="page-head">
      <div class="titles">
        <div class="kicker">Updates hub</div>
        <h1>Notifications</h1>
        <p class="lede">Live updates about your learning path, grades, badges, achievements, and upcoming actions in SecureFood School.</p>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <span class="chip solid-teal"><span class="material-symbols-rounded">sync</span>Synced 2 min ago</span>
        <button class="btn btn-primary" id="markAllBtn"><span class="material-symbols-rounded">done_all</span>Mark all as read</button>
      </div>
    </div>

    <div class="notify-layout">
      <section class="card notify-panel">
        <div class="notify-toolbar">
          <div class="notify-filters" id="notifyFilters">
            <button class="notify-filter active" data-filter="all">All</button>
            <button class="notify-filter" data-filter="learning">Learning</button>
            <button class="notify-filter" data-filter="grades">Grades</button>
            <button class="notify-filter" data-filter="rewards">Badges &amp; Achievements</button>
            <button class="notify-filter" data-filter="system">System</button>
          </div>
          <button class="notify-filter" id="unreadToggle">Unread only</button>
        </div>
        <div class="notify-list" id="notifyList"></div>
      </section>

      <aside class="side-stack">
        <div class="card side-card">
          <h3>Learning reminders</h3>
          <div class="side-list">
            <div class="side-row"><span class="material-symbols-rounded">task_alt</span><div><strong>Report Translation Lab</strong><div style="color:var(--muted);font-size:0.78rem;">Continue Module 2 before Monday 18:00</div></div></div>
            <div class="side-row"><span class="material-symbols-rounded">event</span><div><strong>Mentor check-in</strong><div style="color:var(--muted);font-size:0.78rem;">May 5 · 16:00 · Room B-204</div></div></div>
            <div class="side-row"><span class="material-symbols-rounded">rule</span><div><strong>Peer review pending</strong><div style="color:var(--muted);font-size:0.78rem;">2 submissions are waiting for your feedback</div></div></div>
          </div>
        </div>

        <div class="card side-card">
          <h3>Recent rewards</h3>
          <div class="side-list">
            <div class="side-row"><span class="material-symbols-rounded">local_fire_department</span><div><strong>Streak Keeper</strong><div style="color:var(--muted);font-size:0.78rem;">4-day learning streak · +25 XP</div></div></div>
            <div class="side-row"><span class="material-symbols-rounded">military_tech</span><div><strong>Guardian badge</strong><div style="color:var(--muted);font-size:0.78rem;">Decision simulation passed without safety violations</div></div></div>
            <div class="side-row"><span class="material-symbols-rounded">emoji_events</span><div><strong>Leaderboard change</strong><div style="color:var(--muted);font-size:0.78rem;">Moved to #8 in your cohort</div></div></div>
          </div>
        </div>

        <div class="card side-card">
          <h3>Grade watch</h3>
          <div class="grade-watch">
            <div class="grade-row"><div><div class="subject">Data Quality Checks</div><div class="meta">Quiz · posted today</div></div><div class="value">92%</div></div>
            <div class="grade-row"><div><div class="subject">Context Brief Decoding</div><div class="meta">Assignment · 2 days ago</div></div><div class="value">88%</div></div>
            <div class="grade-row"><div><div class="subject">Risk Signal Mapping</div><div class="meta">Lab report · 5 days ago</div></div><div class="value">95%</div></div>
          </div>
        </div>
      </aside>
    </div>
  `
);

const notifications = [
  {
    id: 1,
    category: 'learning',
    bucket: 'Today',
    icon: 'menu_book',
    title: 'Module unlocked: Stakeholder Role-play',
    desc: 'Stage 2 course 06 is now available. Start it to keep your plan progress on track.',
    when: '12 min ago',
    unread: true,
    tags: ['Student Lab', 'Course unlock']
  },
  {
    id: 2,
    category: 'grades',
    bucket: 'Today',
    icon: 'grading',
    title: 'New grade posted: Data Quality Checks quiz',
    desc: 'Your score is 92%. Feedback includes 2 optional improvement points before the next stage.',
    when: '25 min ago',
    unread: true,
    tags: ['Assessment', 'Score update']
  },
  {
    id: 3,
    category: 'rewards',
    bucket: 'Today',
    icon: 'local_fire_department',
    title: 'Badge earned: Streak Keeper',
    desc: 'You completed lessons for 4 consecutive days and earned +25 XP.',
    when: '1 h ago',
    unread: true,
    tags: ['Badge', 'XP reward']
  },
  {
    id: 4,
    category: 'rewards',
    bucket: 'This week',
    icon: 'emoji_events',
    title: 'Achievement unlocked: Translation Sprint',
    desc: 'Finished the Report Translation Lab draft in under 48 hours.',
    when: 'Yesterday',
    unread: true,
    tags: ['Achievement', 'Stage 2']
  },
  {
    id: 5,
    category: 'learning',
    bucket: 'This week',
    icon: 'forum',
    title: 'Mentor comment received',
    desc: 'Your mentor added notes to the community-facing brief. Open the feedback thread.',
    when: 'Yesterday',
    unread: false,
    tags: ['Mentor', 'Feedback']
  },
  {
    id: 6,
    category: 'system',
    bucket: 'This week',
    icon: 'event',
    title: 'Schedule update: live lab moved',
    desc: 'The Tuesday live session starts at 16:00 instead of 15:30 due to mentor availability.',
    when: '2 days ago',
    unread: false,
    tags: ['Schedule', 'Calendar']
  },
  {
    id: 7,
    category: 'grades',
    bucket: 'This week',
    icon: 'fact_check',
    title: 'Peer review feedback is ready',
    desc: 'Two peers reviewed your assignment. Check notes before final submission.',
    when: '3 days ago',
    unread: true,
    tags: ['Peer review', 'Action needed']
  },
  {
    id: 8,
    category: 'learning',
    bucket: 'Earlier',
    icon: 'lock_open',
    title: 'Stage 3 prerequisite reminder',
    desc: 'Complete Course 06 to unlock the Living Labs Validation stage.',
    when: '4 days ago',
    unread: false,
    tags: ['Progress', 'Reminder']
  },
  {
    id: 9,
    category: 'rewards',
    bucket: 'Earlier',
    icon: 'leaderboard',
    title: 'Leaderboard change',
    desc: 'You moved from #10 to #8 in your cohort this week.',
    when: '5 days ago',
    unread: false,
    tags: ['Ranking', 'Cohort']
  },
  {
    id: 10,
    category: 'system',
    bucket: 'Earlier',
    icon: 'verified',
    title: 'Certificate template updated',
    desc: 'The completion certificate now includes project grant metadata and mentor signature block.',
    when: '1 week ago',
    unread: false,
    tags: ['Platform', 'Documents']
  }
];

const listEl = document.getElementById('notifyList');
const unreadToggle = document.getElementById('unreadToggle');
const markAllBtn = document.getElementById('markAllBtn');
let activeFilter = 'all';
let unreadOnly = false;

function prettyCategory(category) {
  if (category === 'learning') return 'Learning';
  if (category === 'grades') return 'Grades';
  if (category === 'rewards') return 'Rewards';
  return 'System';
}

function renderSummary() {
  const unread = notifications.filter(n => n.unread).length;
  markAllBtn.disabled = unread === 0;
}

function renderList() {
  const filtered = notifications.filter(n => {
    const byType = activeFilter === 'all' || n.category === activeFilter;
    const byUnread = !unreadOnly || n.unread;
    return byType && byUnread;
  });

  if (!filtered.length) {
    listEl.innerHTML = '<div class="list-empty">No notifications match the selected filter.</div>';
    return;
  }

  const bucketOrder = ['Today', 'This week', 'Earlier'];
  listEl.innerHTML = bucketOrder.map(bucket => {
    const entries = filtered.filter(n => n.bucket === bucket);
    if (!entries.length) return '';
    return `
      <div class="notify-group">
        <div class="notify-group-label">${bucket}</div>
        ${entries.map(n => `
          <article class="notify-item ${n.unread ? 'unread' : ''}">
            <div class="notify-icon ${n.category}">
              <span class="material-symbols-rounded">${n.icon}</span>
            </div>
            <div class="notify-body">
              <div class="title">${n.title}</div>
              <p class="desc">${n.desc}</p>
              <div class="notify-meta">
                <span class="chip">${prettyCategory(n.category)}</span>
                ${n.tags.map(tag => `<span class="chip">${tag}</span>`).join('')}
              </div>
            </div>
            <div class="notify-actions">
              <div class="notify-when">${n.when}</div>
              ${n.unread
                ? `<button class="mini-btn" data-mark="${n.id}">Mark read</button>`
                : `<span class="chip solid-success"><span class="material-symbols-rounded">done</span>Read</span>`
              }
            </div>
          </article>
        `).join('')}
      </div>
    `;
  }).join('');
}

document.getElementById('notifyFilters').addEventListener('click', (event) => {
  const btn = event.target.closest('[data-filter]');
  if (!btn) return;
  activeFilter = btn.dataset.filter;
  document.querySelectorAll('.notify-filter[data-filter]').forEach(filterBtn => {
    filterBtn.classList.toggle('active', filterBtn === btn);
  });
  renderList();
});

unreadToggle.addEventListener('click', () => {
  unreadOnly = !unreadOnly;
  unreadToggle.classList.toggle('active', unreadOnly);
  renderList();
});

listEl.addEventListener('click', (event) => {
  const action = event.target.closest('[data-mark]');
  if (!action) return;
  const id = Number(action.dataset.mark);
  const item = notifications.find(n => n.id === id);
  if (!item) return;
  item.unread = false;
  renderSummary();
  renderList();
});

markAllBtn.addEventListener('click', () => {
  notifications.forEach(n => {
    n.unread = false;
  });
  renderSummary();
  renderList();
});

renderSummary();
renderList();
</script>
</body>
</html>
