<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecureFood School · Student Lab</title>
<link rel="stylesheet" href="./styles.css">
<script src="./js/shell.js"></script>
<style>
/* ── Slim plan header ───────────────────────────────── */
.plan-bar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 18px; padding: 16px 22px;
  background: linear-gradient(135deg, var(--primary) 0%, #1a6373 100%);
  color: #fff; border-radius: var(--radius-lg);
  margin-bottom: 22px;
  box-shadow: 0 6px 20px -8px rgba(15,76,94,0.4);
}
.plan-bar .plan-left { display:flex; align-items:center; gap: 16px; flex:1; min-width:0; }
.plan-bar .pin {
  width: 44px; height: 44px; border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.14);
  display: grid; place-items: center;
  flex-shrink: 0;
}
.plan-bar .pin .material-symbols-rounded { font-size: 24px; color: #E0A458; }
.plan-bar .plan-info .label {
  font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em;
  color: rgba(255,255,255,0.7); font-weight: 600;
}
.plan-bar .plan-info h2 {
  font-size: 1.15rem; color: #fff; margin: 2px 0 0;
  font-family: 'Manrope'; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
}
.plan-bar .plan-info h2 .material-symbols-rounded {
  font-size: 18px; opacity: 0.7; transition: opacity 0.15s;
  color: #fff;
}
.plan-bar .plan-info h2:hover .material-symbols-rounded { opacity: 1; }
.plan-bar .plan-stats {
  display: flex; gap: 28px; align-items: center;
}
.plan-bar .plan-stat .num {
  font-family: 'Manrope'; font-weight: 700;
  font-size: 1.2rem; color: #E0A458;
  line-height: 1;
}
.plan-bar .plan-stat .lbl {
  font-size: 0.72rem; color: rgba(255,255,255,0.7);
  margin-top: 4px; text-transform: uppercase; letter-spacing: 0.06em;
}
.plan-bar .plan-progress {
  width: 220px;
}
.plan-bar .plan-progress .bar {
  height: 6px; border-radius: 999px; background: rgba(255,255,255,0.18);
  overflow: hidden;
}
.plan-bar .plan-progress .bar span {
  display: block; height: 100%;
  background: linear-gradient(90deg, #E0A458, #C68A3B);
  border-radius: 999px;
  transition: width 0.4s ease;
}
.plan-bar .plan-progress .pct {
  display: flex; justify-content: space-between;
  font-size: 0.72rem; color: rgba(255,255,255,0.8);
  margin-top: 6px;
}
.plan-bar .plan-progress .pct strong { color: #fff; font-family: 'Manrope'; font-weight: 700; }
.plan-bar.plan-changing .plan-info,
.plan-bar.plan-changing .plan-stats,
.plan-bar.plan-changing .plan-progress {
  opacity: 0.5;
  transform: translateY(-4px);
  transition: opacity 0.16s ease, transform 0.16s ease;
}

/* Plan switcher dropdown */
.plan-switcher {
  position: relative;
}
.plan-menu {
  position: absolute; top: calc(100% + 8px); left: 0;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--radius-md);
  box-shadow: 0 12px 32px -8px rgba(0,0,0,0.18);
  min-width: 320px; padding: 8px;
  z-index: 50;
  opacity: 0;
  transform: translateY(-6px);
  pointer-events: none;
  transition: opacity 0.16s ease, transform 0.16s ease;
}
.plan-menu.open {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
.plan-menu-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: var(--radius-sm);
  cursor: pointer;
}
.plan-menu-item:hover { background: var(--surface-2); }
.plan-menu-item.active { background: var(--primary-50); }
.plan-menu-item .pm-icon {
  width: 32px; height: 32px; border-radius: var(--radius-sm);
  background: var(--accent-50); color: var(--accent);
  display: grid; place-items: center; flex-shrink: 0;
}
.plan-menu-item .pm-text strong {
  display: block; font-size: 0.9rem; color: var(--ink);
}
.plan-menu-item .pm-text small {
  font-size: 0.76rem; color: var(--muted);
}

/* ── Course section ─────────────────────────────────── */
.plan-sections {
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.plan-sections.is-switching {
  opacity: 0.35;
  transform: translateY(8px);
}
.course-section { margin-bottom: 32px; }
.course-section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 14px; gap: 16px;
}
.course-section-head .section-title {
  display: flex; align-items: center; gap: 12px;
}
.course-section-head .num-badge {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--primary); color: #fff;
  display: grid; place-items: center;
  font-family: 'Manrope'; font-weight: 700; font-size: 0.95rem;
}
.course-section-head h3 {
  font-size: 1.2rem; margin: 0;
}
.course-section-head .section-meta {
  font-size: 0.84rem; color: var(--muted);
}
.course-section-head .section-meta .dot { margin: 0 8px; opacity: 0.4; }
.course-section.done .num-badge { background: var(--success); }
.course-section.locked .num-badge { background: var(--muted); }

.course-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.course-tile {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  overflow: hidden;
  display: flex; flex-direction: column;
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s, opacity 0.2s;
  cursor: pointer;
}
.course-tile:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px -10px rgba(0,0,0,0.15);
  border-color: var(--primary);
}
.course-tile.launching {
  opacity: 0.7;
  transform: scale(0.99);
}
.course-tile .ct-cover {
  height: 100px;
  position: relative;
  display: flex; align-items: center; justify-content: center;
  color: #fff; flex-shrink: 0;
  overflow: hidden;
}
.course-tile .ct-cover::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0) 50%, rgba(0,0,0,0.18));
}
.course-tile .ct-cover .ct-icon {
  width: 48px; height: 48px;
  background: rgba(255,255,255,0.18);
  border-radius: var(--radius-sm);
  display: grid; place-items: center;
  position: relative; z-index: 1;
}
.course-tile .ct-cover .ct-icon .material-symbols-rounded { font-size: 26px; }
.course-tile .ct-cover .ct-tag {
  position: absolute; top: 10px; left: 12px;
  font-size: 0.7rem; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: rgba(255,255,255,0.95);
  z-index: 1;
}
.course-tile .ct-cover .ct-status {
  position: absolute; top: 10px; right: 12px;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(6px);
  font-size: 0.7rem; font-weight: 600;
  padding: 4px 8px; border-radius: 999px;
  display: flex; align-items: center; gap: 4px;
  z-index: 1;
}
.course-tile .ct-cover .ct-status .material-symbols-rounded { font-size: 14px; }
.cov-1 { background: linear-gradient(135deg, #0F4C5E, #2A8C8A); }
.cov-2 { background: linear-gradient(135deg, #2A8C8A, #4FC3C0); }
.cov-3 { background: linear-gradient(135deg, #C68A3B, #E0A458); }
.cov-4 { background: linear-gradient(135deg, #3F8C5A, #65B57F); }
.cov-5 { background: linear-gradient(135deg, #5b6770, #8e9aa3); }

.course-tile .ct-body {
  padding: 14px 16px 16px;
  flex: 1; display: flex; flex-direction: column;
}
.course-tile .ct-body h4 {
  font-size: 1rem; margin-bottom: 6px;
  line-height: 1.35;
}
.course-tile .ct-body .ct-desc {
  font-size: 0.82rem; color: var(--muted);
  line-height: 1.5; margin-bottom: 12px;
  flex: 1;
}
.course-tile .ct-meta {
  display: flex; gap: 14px; font-size: 0.78rem; color: var(--muted);
  margin-bottom: 10px;
}
.course-tile .ct-meta span {
  display: flex; align-items: center; gap: 4px;
}
.course-tile .ct-meta .material-symbols-rounded { font-size: 14px; }
.course-tile .ct-progress {
  height: 4px; background: var(--line); border-radius: 999px;
  overflow: hidden; margin-bottom: 8px;
}
.course-tile .ct-progress span {
  display: block; height: 100%; background: var(--accent);
  border-radius: 999px;
}
.course-tile.done .ct-progress span { background: var(--success); }
.course-tile .ct-foot {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 0.78rem;
}
.course-tile .ct-foot .ct-state-text { color: var(--muted); }
.course-tile.done .ct-foot .ct-state-text { color: var(--success); font-weight: 600; }
.course-tile.active .ct-foot .ct-state-text { color: var(--accent); font-weight: 600; }
.course-tile .ct-foot .ct-action {
  color: var(--primary); font-weight: 600;
  display: flex; align-items: center; gap: 2px;
}

.course-tile.locked { opacity: 0.7; cursor: not-allowed; }
.course-tile.locked:hover { transform: none; box-shadow: none; border-color: var(--line); }
.course-tile.locked .ct-cover { filter: grayscale(0.6); }

@media (max-width: 760px) {
  .plan-bar { flex-direction: column; align-items: stretch; }
  .plan-bar .plan-progress { width: 100%; }
  .plan-bar .plan-stats { justify-content: space-around; }
}
</style>
</head>
<body data-page="l4c">
<script>

const planBarWrap = document.getElementById('planBarWrap');
const planSections = document.getElementById('planSections');
const planMenu = document.getElementById('planMenu');
const planTrigger = document.getElementById('planTrigger');
let activePlan = localStorage.getItem(STORAGE_KEY) || 'analyst';
if (!PLAN_DATA[activePlan]) activePlan = 'analyst';

function statusBadge(course) {
  if (course.state === 'done') return '<span class="material-symbols-rounded">check_circle</span>Done';
  if (course.state === 'active') return '<span class="material-symbols-rounded">play_circle</span>Active';
  if (course.state === 'locked') return '<span class="material-symbols-rounded">lock</span>Locked';
  return '<span class="material-symbols-rounded">lock_open</span>Up next';
}

function renderBadge(section) {
  if (section.badgeType === 'done') return '<span class="material-symbols-rounded" style="font-size:18px;">done</span>';
  if (section.badgeType === 'lock') return '<span class="material-symbols-rounded" style="font-size:18px;">lock</span>';
  return section.badgeNumber || '';
}

function renderPlanSections(plan) {
  return plan.sections.map(section => `
    <section class="course-section ${section.status || ''}">
      <div class="course-section-head">
        <div class="section-title">
          <div class="num-badge" ${section.badgeColor ? `style="background:${section.badgeColor};"` : ''}>${renderBadge(section)}</div>
          <h3>${section.title}</h3>
        </div>
        <div class="section-meta">
          <span>${section.meta.courses}</span><span class="dot">·</span><span>${section.meta.effort}</span><span class="dot">·</span><span style="color:${section.meta.stateColor};font-weight:600;">${section.meta.state}</span>
        </div>
      </div>
      <div class="course-grid">
        ${section.courses.map(course => `
          <article class="course-tile ${course.state === 'done' ? 'done' : ''} ${course.state === 'active' ? 'active' : ''} ${course.state === 'locked' ? 'locked' : ''} fade-in"
            data-course-id="${course.id}"
            data-course-title="${course.title}">
            <div class="ct-cover ${course.cover}">
              <div class="ct-tag">Course ${course.id}</div>
              <div class="ct-status" ${course.state === 'active' ? 'style="background:#E0A458;color:#fff;"' : ''}>${statusBadge(course)}</div>
              <div class="ct-icon"><span class="material-symbols-rounded">${course.icon}</span></div>
            </div>
            <div class="ct-body">
              <h4>${course.title}</h4>
              <p class="ct-desc">${course.desc}</p>
              <div class="ct-meta"><span><span class="material-symbols-rounded">view_module</span>${course.modules}</span><span><span class="material-symbols-rounded">schedule</span>${course.duration}</span></div>
              <div class="ct-progress"><span style="width:${course.progress}%"></span></div>
              <div class="ct-foot">
                <span class="ct-state-text">${course.stateText}</span>
                ${course.action ? `<a class="ct-action">${course.action}<span class="material-symbols-rounded" style="font-size:14px;">arrow_forward</span></a>` : ''}
              </div>
            </div>
          </article>
        `).join('')}
      </div>
    </section>
  `).join('');
}

function applyPlan(planKey, animated) {
  const plan = PLAN_DATA[planKey];
  if (!plan) return;
  const doUpdate = () => {
    document.getElementById('planName').textContent = plan.name;
    document.getElementById('planPinIcon').textContent = plan.pinIcon;
    document.getElementById('planCourses').textContent = plan.stats.courses;
    document.getElementById('planComplete').textContent = plan.stats.complete;
    document.getElementById('planLevel').textContent = plan.stats.level;
    document.getElementById('planStage').textContent = plan.stats.stage;
    document.getElementById('planPct').textContent = plan.stats.complete;
    planSections.innerHTML = renderPlanSections(plan);
    requestAnimationFrame(() => {
      document.getElementById('planProgressBar').style.width = `${plan.stats.progress}%`;
    });
    document.querySelectorAll('.plan-menu-item').forEach(item => {
      item.classList.toggle('active', item.dataset.plan === planKey);
    });
  };

  if (!animated) {
    doUpdate();
    return;
  }

  planBarWrap.classList.add('plan-changing');
  planSections.classList.add('is-switching');
  setTimeout(() => {
    doUpdate();
    planSections.classList.remove('is-switching');
    planBarWrap.classList.remove('plan-changing');
  }, 170);
}

function switchPlan(planKey) {
  if (planKey === activePlan || !PLAN_DATA[planKey]) return;
  activePlan = planKey;
  localStorage.setItem(STORAGE_KEY, activePlan);
  applyPlan(activePlan, true);
}

planTrigger.addEventListener('click', (event) => {
  event.stopPropagation();
  planMenu.classList.toggle('open');
});
document.addEventListener('click', (event) => {
  if (!planMenu.contains(event.target) && !planTrigger.contains(event.target)) {
    planMenu.classList.remove('open');
  }
});

planMenu.addEventListener('click', (event) => {
  const item = event.target.closest('[data-plan]');
  if (!item) return;
  switchPlan(item.dataset.plan);
  planMenu.classList.remove('open');
});

planSections.addEventListener('click', (event) => {
  const tile = event.target.closest('.course-tile');
  if (!tile || tile.classList.contains('locked')) return;
  tile.classList.add('launching');
  const url = new URL('./course.html', window.location.href);
  url.searchParams.set('plan', activePlan);
  url.searchParams.set('course', tile.dataset.courseId || '');
  url.searchParams.set('title', tile.dataset.courseTitle || '');
  setTimeout(() => {
    window.location.href = url.toString();
  }, 110);
});

applyPlan(activePlan, false);
</script>
</body>
</html>
