services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SFS_HTTP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php-fpm:
        condition: service_healthy
    networks:
      - sfs-network

  php-fpm:
    build:
      context: ./php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./moodledata:/var/www/moodledata
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MOODLE_DB_NAME:-moodle}
      DB_USER: ${MOODLE_DB_USER:-moodle}
      DB_PASSWORD: ${MOODLE_DB_PASSWORD:-moodlepass}
      REDIS_HOST: redis
      MOODLE_REDIS_SESSIONS: ${MOODLE_REDIS_SESSIONS:-1}
      MOODLE_WWWROOT: ${MOODLE_WWWROOT:-http://localhost:8080}
      MOODLE_DEBUG: ${MOODLE_DEBUG:-0}
      MOODLE_ADMIN_USER: ${MOODLE_ADMIN_USER:-admin}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD:-ChangeMe123!}
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL:-admin@example.test}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t 2>&1 | grep -q 'test is successful'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sfs-network

  cron:
    build:
      context: ./php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./moodledata:/var/www/moodledata
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MOODLE_DB_NAME:-moodle}
      DB_USER: ${MOODLE_DB_USER:-moodle}
      DB_PASSWORD: ${MOODLE_DB_PASSWORD:-moodlepass}
      REDIS_HOST: redis
      MOODLE_REDIS_SESSIONS: ${MOODLE_REDIS_SESSIONS:-1}
      MOODLE_WWWROOT: ${MOODLE_WWWROOT:-http://localhost:8080}
      MOODLE_DEBUG: ${MOODLE_DEBUG:-0}
    entrypoint: ["/bin/sh", "-c", "while true; do php admin/cli/cron.php > /proc/1/fd/1 2>&1; sleep 60; done"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sfs-network

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${SFS_DB_PORT:-33067}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MOODLE_DB_NAME:-moodle}
      MYSQL_USER: ${MOODLE_DB_USER:-moodle}
      MYSQL_PASSWORD: ${MOODLE_DB_PASSWORD:-moodlepass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - sfs-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sfs-network

volumes:
  mysql_data:
  redis_data:

networks:
  sfs-network:
    driver: bridge
