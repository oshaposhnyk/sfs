# Internal nginx vhost. Only reachable from Caddy on the edge network; TLS and
# HSTS are handled upstream by Caddy. Serves static assets and hands .php to
# php-fpm. Based on the dev vhost, hardened for production.

# Trust the reverse proxy for the real client IP (Caddy is the only source).
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Real-IP;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /var/www/html/public;
    index index.php;
    autoindex off;
    client_max_body_size 100M;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # moodledata must never be web-served (it lives outside the webroot anyway).
    location ^~ /moodledata/ { return 404; }

    # Block dotfiles except ACME/well-known.
    location ~ /\.(?!well-known/) { return 404; }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 1w;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* \.(?:ttf|ttc|otf|eot|woff|woff2)$ {
        expires 1w;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ ^(.+?\.php)(/.*)?$ {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        if (!-f $document_root$fastcgi_script_name) { return 404; }

        include fastcgi_params;
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PATH_TRANSLATED $document_root$fastcgi_path_info;
        fastcgi_param DOCUMENT_ROOT $document_root;
        # Behind TLS proxy: force https awareness for Moodle.
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location / {
        try_files $uri $uri/ /r.php$is_args$args;
    }
}
