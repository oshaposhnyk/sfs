; Production PHP settings for Moodle. Differences from dev:
;   - opcache does NOT revalidate files (code is immutable in the image)
;   - PHP version + errors are never exposed to visitors
;   - errors go to the container log, never to the browser
file_uploads = On
max_execution_time = 300
max_input_vars = 5000
memory_limit = 512M
post_max_size = 100M
upload_max_filesize = 100M

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Hardened session cookie handling is also enforced by Moodle itself.
session.cookie_httponly = 1
session.use_strict_mode = 1

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Immutable code baked into the image → never stat files for changes.
opcache.validate_timestamps = 0
opcache.save_comments = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600
